name: potea_app
description: "A new Flutter project."

# Prevent publishing to pub.dev (keep private)
publish_to: "none"

# Versioning
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ────────────────────────────────
  # 🧱 CORE FLUTTER PACKAGES
  # ────────────────────────────────
  cupertino_icons: ^1.0.8
  gap: ^3.0.1
  flutter_svg: ^2.2.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  animate_do: ^4.2.0
  skeletonizer: ^2.1.0+1
  carousel_slider: ^5.1.1
  flutter_rating_bar: ^4.0.1
  cached_network_image: ^3.4.1

  # ────────────────────────────────
  # 🧭 STATE MANAGEMENT & DEPENDENCY INJECTION
  # ────────────────────────────────
  bloc: ^9.0.1
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0

  # ────────────────────────────────
  # 🌐 ROUTING & NETWORK
  # ────────────────────────────────
  go_router: ^16.2.4
  dio: ^5.9.0

  # ────────────────────────────────
  # 💾 LOCAL STORAGE
  # ────────────────────────────────
  shared_preferences: ^2.5.3

  # ────────────────────────────────
  # ☁️ FIREBASE & CLOUD SERVICES
  # ────────────────────────────────
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  google_sign_in: ^7.2.0

  # ────────────────────────────────
  # 🧩 UTILITIES & FUNCTIONAL PROGRAMMING
  # ────────────────────────────────
  dartz: ^0.10.1

  # ────────────────────────────────
  # 💻 DEVELOPMENT TOOLS
  # ────────────────────────────────
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 🧹 LINTING & CODE QUALITY
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ────────────────────────────────
  # 🖼️ ASSETS
  # ────────────────────────────────
  assets:
    - assets/images/
    - assets/lotties/
    - assets/svgs/

  # ────────────────────────────────
  # 🔤 FONTS
  # ────────────────────────────────
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/font/Poppins-Black.ttf
          weight: 900
        - asset: assets/font/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/font/Poppins-Bold.ttf
          weight: 700
        - asset: assets/font/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/font/Poppins-Medium.ttf
          weight: 500
        - asset: assets/font/Poppins-Regular.ttf
          weight: 400
        - asset: assets/font/Poppins-Light.ttf
          weight: 300
        - asset: assets/font/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/font/Poppins-Thin.ttf
          weight: 100
